name: userland

# Build the socrates userland image and fold it into a boot image.
#
# The kernel and the firmware come from an earlier build-kernel run: this workflow only
# compiles userland/ (a static Mach-O, ad-hoc signed, wrapped in the N4KROOT container that
# mockfs understands) and then runs the normal payload + bootimg steps with `--userland`.
#
# Inputs:
#   source_run      id of a build-kernel run that produced socrates-kernel and socrates-firmware
#   unique_chip_id  platform seed for the ADT (8-byte hex)

on:
  workflow_dispatch:
    inputs:
      source_run:
        description: 'Run id that produced socrates-kernel and socrates-firmware'
        required: true
      unique_chip_id:
        description: 'Platform seed (8-byte hex) for the ADT'
        required: false
        default: '0000000000000001'

permissions:
  actions: read
  contents: read

jobs:
  userland:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout device repository (UniXNU-socrates)
        uses: actions/checkout@v4

      - name: Checkout UniXNU build system (with submodules)
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU  # TODO(socrates-firmware): move to your fork's socrates branch if framework patches are needed
          ref: main
          submodules: recursive
          path: unixnu

      - name: Checkout Mu-Silicium device firmware (uefi-socrates)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/uefi-socrates
          ref: main
          submodules: recursive
          path: uefi

      - name: Download the prelinked kernel from the source run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out/socrates/kernel
          gh run download "${{ inputs.source_run }}" -R "${{ github.repository }}" \
            -n socrates-kernel -D out/socrates/kernel
          ls -l out/socrates/kernel

      - name: Download the firmware volume from the source run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p firmware-artifact
          gh run download "${{ inputs.source_run }}" -R "${{ github.repository }}" \
            -n socrates-firmware -D firmware-artifact
          find firmware-artifact -name 'SILICIUM_UEFI.fd' -print

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build device-tree-compiler mtools \
            python3 python3-pip clang lld llvm git curl
          python3 -m pip install --break-system-packages -r uefi/pip-requirements.txt

      - name: Provide unversioned LLVM tools
        run: |
          mkdir -p "$HOME/llvm-bin"
          for tool in llvm-nm llvm-objcopy llvm-size llvm-readelf llvm-ar llvm-strip \
                      ld.lld clang ld64.lld; do
            found="$(command -v "$tool" || true)"
            if [ -z "$found" ]; then
              found="$(compgen -c "$tool-" | sort -V | tail -n 1 || true)"
              found="$(command -v "$found" || true)"
            fi
            if [ -z "$found" ]; then
              echo "::warning::Cannot find $tool"
              continue
            fi
            ln -sf "$found" "$HOME/llvm-bin/$tool"
          done
          echo "$HOME/llvm-bin" >> "$GITHUB_PATH"
          ls -l "$HOME/llvm-bin"

      - name: Test the signer and the container packer
        run: |
          python3 userland/test-adhoc.py
          python3 - <<'PY'
          import struct, subprocess, sys, tempfile, pathlib
          tmp = pathlib.Path(tempfile.mkdtemp())
          (tmp/'launchd.macho').write_bytes(b'\xcf\xfa\xed\xfe' + b'A' * 12345)
          (tmp/'motd.txt').write_bytes(b'container test\n' * 4)
          subprocess.run([sys.executable, 'userland/mkn4kroot.py',
                          '--launch', str(tmp/'launchd.macho'),
                          '--test', str(tmp/'motd.txt'),
                          '--output', str(tmp/'userland.img')], check=True)
          d = (tmp/'userland.img').read_bytes()
          magic, ver, cnt, lo, ls, to, ts = struct.unpack_from('<8sII4Q', d, 0)
          assert (magic, ver, cnt, lo) == (b'N4KROOT\x00', 1, 2, 4096), (magic, ver, cnt, lo)
          assert to % 4096 == 0 and to >= 8192 and ls <= to - lo and ts <= len(d) - to
          assert d[lo:lo + ls] == (tmp/'launchd.macho').read_bytes()
          print('container: ok')
          PY

      - name: Build the userland image
        run: |
          bash userland/build.sh "$GITHUB_WORKSPACE/userland-build"

      - name: Verify the image the way mockfs will read it
        run: |
          python3 - <<'PY'
          import json, struct, pathlib, sys
          img = pathlib.Path('userland-build/userland.img').read_bytes()
          magic, version, count, launch_off, launch_size, test_off, test_size = \
              struct.unpack_from('<8sII4Q', img, 0)
          rep = json.loads(pathlib.Path('userland-build/userland.json').read_text())
          print(f'magic={magic!r} version={version} count={count}')
          print(f'launch {launch_size} @ {launch_off}, test {test_size} @ {test_off}, total {len(img)}')
          print(f'cdhash {rep["cdhash"]}, code_limit {rep["code_limit"]}, pages {rep["pages"]}')
          ok = (magic == b'N4KROOT\x00' and version == 1 and count == 2
                and launch_off == 4096 and launch_size > 0 and test_size > 0
                and test_off % 4096 == 0 and test_off >= 8192
                and launch_size <= test_off - launch_off
                and test_size <= len(img) - test_off
                and len(img) <= 32 * 1024 * 1024)
          # The launch file must really be the signed Mach-O, header and cdhash included.
          m = img[launch_off:launch_off + launch_size]
          if struct.unpack_from('<I', m, 0)[0] != 0xfeedfacf:
              print('launch file is not a 64-bit Mach-O'); ok = False
          # No dynamic linker: this root has no dyld, so a LOAD_DYLINKER command
          # would make the kernel hand the image to something that is not there.
          ncmds, = struct.unpack_from('<I', m, 16)
          off, cmds = 32, set()
          for _ in range(ncmds):
              cmd, size = struct.unpack_from('<II', m, off)
              cmds.add(cmd)
              off += size
          for name, code in (('LC_LOAD_DYLINKER', 0x0e), ('LC_LOAD_DYLIB', 0x0c),
                             ('LC_CODE_SIGNATURE', 0x1d)):
              print(f'{"has" if code in cmds else "no "} {name}')
          if 0x0e in cmds or 0x0c in cmds or 0x1d not in cmds:
              print('load commands are not those of a signed static image'); ok = False
          # The entry must be LC_UNIXTHREAD (the kernel never reads LC_MAIN -
          # mach_loader.c: dyld does - and the LC_MAIN path demands a dyld this
          # root does not have): an arm_thread_state64, 288 bytes, flavor 6,
          # count 68, sp 0 so the kernel places the default stack.
          if 0x80000028 in cmds or 0x5 not in cmds:
              print('entry command is not LC_UNIXTHREAD'); ok = False
          else:
              off, found = 32, None
              for _ in range(ncmds):
                  cmd, size = struct.unpack_from('<II', m, off)
                  if cmd == 0x5:
                      found = off
                  off += size
              ut_size, ut_flavor, ut_count = struct.unpack_from('<3I', m, found + 4)
              ut_sp, ut_pc = struct.unpack_from('<QQ', m, found + 16 + 248)
              if not (ut_size == 288 and ut_flavor == 6 and ut_count == 68 and ut_sp == 0):
                  print('LC_UNIXTHREAD is not a valid arm_thread_state64'); ok = False
              else:
                  print(f'LC_UNIXTHREAD ok: pc 0x{ut_pc:x}')
          if b'\xfa\xde\x0c\xc0' not in m:
              print('no embedded signature SuperBlob'); ok = False
          tc = pathlib.Path('userland-build/kernel.macho.trustcache').read_bytes()
          cdcnt, cdoff = struct.unpack_from('<2I', tc, 0)
          if cdcnt != 1 or cdoff != 8 or struct.unpack_from('<I', tc, 8)[0] != 2:
              print('trust cache header is not version-1/version-2'); ok = False
          entries = struct.unpack_from('<I', tc, 28)[0]
          entry = tc[32:32 + 20].hex()
          print(f'trust cache: {entries} entry, cdhash {entry}')
          if entry != rep['cdhash']:
              print('trust cache does not name the signature that was embedded'); ok = False
          sys.exit(0 if ok else 1)
          PY

      - name: Place the firmware volume where the driver expects it
        run: |
          mkdir -p "uefi/Build/socratesPkg/DEBUG_CLANGPDB/FV"
          cp "$(find firmware-artifact -name 'SILICIUM_UEFI.fd' | head -n 1)" \
             "uefi/Build/socratesPkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd"
          ls -l "uefi/Build/socratesPkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd"

      - name: Configure (defconfig socrates)
        run: |
          python3 unixnu/unixnu defconfig socrates_defconfig -D "$GITHUB_WORKSPACE" --out "$GITHUB_WORKSPACE/out"

      - name: Build the payload volume with the userland as the RAM root
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ inputs.unique_chip_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 unixnu/unixnu build payload \
            -D "$GITHUB_WORKSPACE" --out "$GITHUB_WORKSPACE/out" \
            --uefi "$GITHUB_WORKSPACE/uefi" \
            --kernel "$GITHUB_WORKSPACE/out/socrates/kernel/kernel.macho" \
            --userland "$GITHUB_WORKSPACE/userland-build/userland.img" \
            --owner-trust-cache "$GITHUB_WORKSPACE/userland-build/kernel.macho.trustcache" \
            --unique-chip-id "$UNIXNU_UNIQUE_CHIP_ID"

      - name: Pack the boot image (BootShim + FD + DTB + payload)
        run: |
          python3 unixnu/unixnu bootimg \
            -D "$GITHUB_WORKSPACE" --out "$GITHUB_WORKSPACE/out" \
            --uefi "$GITHUB_WORKSPACE/uefi" \
            --dtb "$GITHUB_WORKSPACE/scripts/data/socrates.dtb"

      - name: Upload the boot image
        uses: actions/upload-artifact@v4
        with:
          name: socrates-boot-userland
          path: |
            out/socrates/boot/boot.img
            out/socrates/boot/boot.json
            out/socrates/payload/payload.img
            out/socrates/payload/payload.json
            userland-build/userland.img
            userland-build/launchd.macho
            userland-build/kernel.macho.trustcache
            userland-build/userland.json
            userland-build/n4kroot.json
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: socrates-userland-logs
          path: |
            out/socrates/logs/
            userland-build/link.log
          if-no-files-found: warn
